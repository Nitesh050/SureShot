[project]
name = "sureshot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sureshot-domain", "sureshot-engine"]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
sureshot-domain = { workspace = true }
sureshot-engine = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]