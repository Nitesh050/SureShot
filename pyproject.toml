[project]
name = "sureshot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sureshot-domain", "sureshot-engine", "sureshot-cli", "sureshot-reporting", "sureshot-persistence"]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
sureshot-domain = { workspace = true }
sureshot-engine = { workspace = true }
sureshot-cli = { workspace = true }
sureshot-reporting = { workspace = true }
sureshot-persistence = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]